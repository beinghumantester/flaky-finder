name: ci

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run cli -- fixtures/pytest-sample.log
      - run: npm run cli -- fixtures/jest-sample.log
      - run: npm run cli -- fixtures/playwright-sample.log
